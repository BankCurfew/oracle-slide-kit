<!doctype html>
<!-- T2182 timeline slide demo · built from template/deck-template.html · components/timeline/ -->
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Timeline Slide Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700;800;900&family=Anuphan:wght@400;600;700&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="timeline-slide.css">
<style>
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
:root{
  --red:#D31145; --char:#1C1C21; --char2:#26262c; --salmon:#E8998D; --gold:#C9A227;
  --white:#FFFFFF; --muted:#B8AFA6; --line:rgba(255,255,255,.12);
  --spring:cubic-bezier(.22,1.2,.36,1);
  --font:"Sarabun","Noto Sans Thai","Leelawadee UI",-apple-system,"Segoe UI",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--font);background:#000;color:var(--white);overflow:hidden;-webkit-font-smoothing:antialiased}
#deck{position:fixed;inset:0}
.slide{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;
  padding:clamp(26px,5.4vw,72px);gap:clamp(12px,2.4vh,26px);overflow-y:auto;background:var(--char)}
.slide.on{display:flex}
/* effect #10 · ANIMATED dot pattern (must drift, not static) */
.slide.dots::after{content:"";position:absolute;inset:-26px;z-index:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);background-size:26px 26px;
  animation:gridmove 14s linear infinite}
@keyframes gridmove{to{background-position:26px 26px}}
.slide>*{position:relative;z-index:2}
/* effect #6 · Ken Burns on image bg */
.slide.img::before{content:"";position:absolute;inset:0;z-index:0;background-image:var(--bg);background-size:cover;background-position:center;
  animation:kenburns 26s ease-in-out infinite alternate}
.slide.img::after{content:"";position:absolute;inset:0;z-index:1;
  background:linear-gradient(90deg,rgba(20,20,24,.96) 0%,rgba(20,20,24,.72) 42%,rgba(20,20,24,.28) 100%),
             radial-gradient(120% 80% at 15% 50%,rgba(211,17,69,.16),transparent 60%)}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.09) translate(1.5%,-1.5%)}}
.wm{position:fixed;top:calc(15px + env(safe-area-inset-top));right:20px;z-index:20;font-weight:800;font-size:14px}
.wm i{color:var(--red);font-style:normal}.wm .a{color:var(--red)}
.pg{position:fixed;top:calc(15px + env(safe-area-inset-top));left:20px;z-index:20;color:var(--muted);font-size:13px;font-weight:700}
/* effect #1 · blur-fade stagger */
.on .rv{opacity:0;filter:blur(9px);transform:translateY(20px);animation:blurup .65s var(--spring) forwards}
.on .rv:nth-child(1){animation-delay:.05s}.on .rv:nth-child(2){animation-delay:.14s}
.on .rv:nth-child(3){animation-delay:.23s}.on .rv:nth-child(4){animation-delay:.32s}
.on .rv:nth-child(5){animation-delay:.41s}.on .rv:nth-child(6){animation-delay:.5s}
@keyframes blurup{to{opacity:1;filter:blur(0);transform:none}}
.kick{color:var(--red);font-weight:800;letter-spacing:.24em;text-transform:uppercase;font-size:clamp(11px,1.5vh,13px)}
h1{font-size:clamp(34px,8vw,74px);font-weight:900;line-height:1.02;letter-spacing:-.02em}
h2{font-size:clamp(26px,5vw,46px);font-weight:900;line-height:1.1;letter-spacing:-.01em}
/* effect #4 · aurora gradient title word */
.aurora{background:linear-gradient(92deg,var(--red),var(--salmon),var(--white),var(--red));
  background-size:280% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:aurora 7s linear infinite}
@keyframes aurora{to{background-position:280% 0}}
.sub{font-size:clamp(15px,2.4vh,20px);color:var(--muted);max-width:44ch;line-height:1.5}
.bar{width:66px;height:5px;border-radius:3px;background:linear-gradient(90deg,var(--red),var(--salmon))}
.g{color:var(--gold)}.r{color:var(--red)}
.grid{display:grid;gap:clamp(10px,1.8vh,16px)}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.card{background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:16px;padding:clamp(15px,2.6vh,24px);
  display:flex;flex-direction:column;gap:9px;backdrop-filter:blur(10px)}
.card .n{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:900;background:rgba(211,17,69,.16);color:var(--red);font-size:17px}
.card.gold{border-color:rgba(201,162,39,.4)}.card.gold .n{background:rgba(201,162,39,.16);color:var(--gold)}
.card h3{font-size:clamp(17px,2.7vh,23px);font-weight:800;line-height:1.2}
.card .say{font-size:clamp(12px,1.7vh,14px);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:clamp(8px,1.4vw,12px)}
.chip{align-self:flex-start;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;
  padding:9px 18px;font-weight:800;font-size:clamp(14px,2vh,18px);white-space:nowrap}
.chip.r{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 0 26px rgba(211,17,69,.4)}
.chip.pain{background:rgba(211,17,69,.12);border-color:rgba(211,17,69,.35)}
.vs{display:flex;flex-direction:column;gap:clamp(12px,2.2vh,20px);max-width:20ch}
.vs .row{background:rgba(255,255,255,.045);border:1px solid var(--line);border-left:5px solid var(--red);border-radius:14px;
  padding:clamp(15px,2.6vh,24px);font-size:clamp(19px,3.4vh,30px);font-weight:900}
.vs .row.truth{border-left-color:var(--gold)}
.vs .row small{display:block;color:var(--muted);font-weight:700;font-size:.5em;margin-top:5px}
.one{font-size:clamp(28px,6.4vw,60px);font-weight:900;line-height:1.06;max-width:15ch;letter-spacing:-.01em}
nav{position:fixed;left:0;right:0;bottom:calc(15px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:9px;z-index:20}
.dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.22);border:none;cursor:pointer;transition:.3s}
.dot.on{background:var(--red);width:26px;border-radius:5px;box-shadow:0 0 12px rgba(211,17,69,.6)}
/* effect #5 · progress bar */
.prog{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--red),var(--salmon));z-index:21;transition:width .4s var(--spring);box-shadow:0 0 10px rgba(211,17,69,.6)}
.arrow{position:fixed;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.06);border:1px solid var(--line);color:#fff;width:44px;height:44px;border-radius:50%;font-size:20px;cursor:pointer;z-index:20;display:grid;place-items:center}
.arrow:hover{background:var(--red);border-color:var(--red)}#prev{left:14px}#next{right:14px}
@media (max-width:680px){.g2,.g3{grid-template-columns:1fr}.arrow{display:none}
  .slide{padding:64px 22px 74px}.slide.img::after{background:linear-gradient(180deg,rgba(20,20,24,.62),rgba(20,20,24,.94))}}
@media (orientation:landscape) and (max-height:520px){.slide{padding:46px clamp(40px,6vw,80px) 52px;gap:9px}
  h1{font-size:clamp(26px,6.4vh,44px)}h2{font-size:clamp(20px,5vh,32px)}.card{padding:10px 15px}.card .say{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.on .rv{opacity:1;filter:none;transform:none}}
/* demo only: overlays readable on the light slides */
body[data-light] .wm,body[data-light] .pg{color:#1A2A45}body[data-light="wb"] .wm{display:none}
body[data-light] .arrow{color:#1A2A45;border-color:rgba(26,42,69,.2);background:rgba(26,42,69,.05)}
</style>
</head>
<body>

  <div class="bar rv"></div>

<button class="arrow" id="prev">‹</button>
<button class="arrow" id="next">›</button>
<nav id="dots"></nav>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script src="timeline-slide.js"></script>
<script>
const slides=[...document.querySelectorAll('.slide')],dots=document.getElementById('dots'),
  cur=document.getElementById('cur'),prog=document.getElementById('prog');
document.getElementById('tot').textContent=slides.length;
let i=0;
slides.forEach((_,k)=>{const b=document.createElement('button');b.className='dot';b.onclick=()=>go(k);dots.appendChild(b)});
const dot=[...dots.children];
function tick(s){s.querySelectorAll('[data-tick]').forEach(el=>{const to=+el.dataset.tick;let t0=null;
  const step=t=>{if(!t0)t0=t;const p=Math.min((t-t0)/600,1);el.textContent=Math.round((1-Math.pow(1-p,3))*to);if(p<1)requestAnimationFrame(step)};requestAnimationFrame(step)})}
function go(n){const was=i;i=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,k)=>s.classList.toggle('on',k===i));
  dot.forEach((d,k)=>d.classList.toggle('on',k===i));
  cur.textContent=i+1;prog.style.width=((i+1)/slides.length*100)+'%';tick(slides[i]);
  /* STEPPER HOOK: a slide may carry el.stepper={next(),prev(),enter(dir)} (e.g. components/timeline).
     Entering forward = its first step, backward = its last step. */
  const s=slides[i].stepper;if(s&&(i!==was||n===was))s.enter(i>=was?1:-1)}
/* every forward/back input goes through these two (keys, swipe, arrows): a stepper slide steps first */
function fwd(){const s=slides[i].stepper;if(s&&s.next())return;go(i+1)}
function back(){const s=slides[i].stepper;if(s&&s.prev())return;go(i-1)}
document.getElementById('next').onclick=fwd;document.getElementById('prev').onclick=back;
addEventListener('keydown',e=>{if(['ArrowRight',' ','PageDown'].includes(e.key))fwd();
  if(['ArrowLeft','PageUp'].includes(e.key))back();if(e.key==='Home')go(0);if(e.key==='End')go(slides.length-1)});
let x0=null;addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});
addEventListener('touchend',e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>48)(dx<0?fwd:back)();x0=null},{passive:true});
go(0);
/* demo only: mark light slides on <body> for the fixed overlays */
new MutationObserver(()=>{const d=slides[i].dataset.light;if(d)document.body.dataset.light=d;else delete document.body.dataset.light}).observe(document.getElementById('deck'),{subtree:true,attributes:true,attributeFilter:['class']});
</script>
